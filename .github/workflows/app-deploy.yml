name: Stupid Gifts — Application deploy
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [deploy, bootstrap]
        default: deploy
        description: App-only deployment; bootstrap is the once-only runtime catalog cutover
permissions:
  contents: read
concurrency:
  group: app-production
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'bootstrap'
    concurrency:
      group: catalog-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.1'}
      - run: env -i HOME=/home/runner PATH="$PATH" CI=true npm ci --ignore-scripts --no-audit --no-fund
      - name: Reconcile saved code intent, preserve accepted catalog, deploy runtime app
        env:
          STUPID_GIFTS_OPERATOR_MODE: hosted
          STUPID_GIFTS_CLOUDFLARE_API_TOKEN: ${{ secrets.STUPID_GIFTS_CLOUDFLARE_API_TOKEN }}
          STUPID_GIFTS_R2_ACCESS_KEY_ID: ${{ secrets.STUPID_GIFTS_R2_ACCESS_KEY_ID }}
          STUPID_GIFTS_R2_SECRET_ACCESS_KEY: ${{ secrets.STUPID_GIFTS_R2_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/catalog/bootstrap-runtime-catalog.mjs
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'deploy'
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.1'}
      - run: env -i HOME=/home/runner PATH="$PATH" CI=true npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy application without waiting for catalog care
        env:
          STUPID_GIFTS_OPERATOR_MODE: hosted
          STUPID_GIFTS_CLOUDFLARE_API_TOKEN: ${{ secrets.STUPID_GIFTS_CLOUDFLARE_API_TOKEN }}
          STUPID_GIFTS_R2_ACCESS_KEY_ID: ${{ secrets.STUPID_GIFTS_R2_ACCESS_KEY_ID }}
          STUPID_GIFTS_R2_SECRET_ACCESS_KEY: ${{ secrets.STUPID_GIFTS_R2_SECRET_ACCESS_KEY }}
        run: node --import tsx scripts/catalog/deploy-runtime-app.mjs
