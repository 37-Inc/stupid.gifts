name: Catalog core

on:
  pull_request:
    paths:
      - '.github/workflows/catalog-core.yml'
      - 'scripts/catalog/**'
      - 'scripts/ops/**'
      - 'lib/catalog/**'
      - 'lib/search-demand.ts'
      - 'tests/catalog-*.test.mjs'
      - 'package*.json'

permissions:
  contents: read

concurrency:
  group: catalog-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:catalog-automation
      - run: npm run test:catalog-availability
      - run: npm run test:homepage
      - run: npm run test:search-demand
      - run: npx tsc -p scripts/staging/tsconfig.json && npx tsc -p workers/site/tsconfig.json
      - run: npm run lint
