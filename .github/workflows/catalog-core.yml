name: Catalog core

on:
  pull_request:
    paths:
      - '.github/workflows/catalog-core.yml'
      - 'scripts/catalog/**'
      - 'scripts/ops/**'
      - 'lib/catalog/**'
      - 'lib/search-demand.ts'
      - 'workers/site/content-admin*.ts'
      - 'workers/site/runtime-*.ts*'
      - 'workers/site/admin-state.ts'
      - 'static-site/runtime/**'
      - '.github/workflows/app-deploy.yml'
      - 'migrations/d1/001[89]*.sql'
      - 'migrations/d1/0020*.sql'
      - 'migrations/d1/0021*.sql'
      - 'workers/catalog-clock.mjs'
      - 'wrangler.catalog-clock.jsonc'
      - 'tests/runtime-*.test.mjs'
      - 'tests/catalog-*.test.mjs'
      - 'package*.json'

permissions:
  contents: read

concurrency:
  group: catalog-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.1'
      - name: Install the reviewed isolated uploader runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo apparmor_parser -r .github/catalog-bwrap.apparmor
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:catalog-automation
      - run: node --experimental-strip-types --test tests/catalog-content-admin.test.mjs tests/catalog-content-admin-dispatch.test.mjs
      - run: node --import tsx --test tests/catalog-admin-admissions.test.mjs tests/catalog-admin-state.test.mjs
      - run: node --import tsx --test tests/runtime-*.test.mjs
      - run: node --import tsx --test tests/catalog-title-repairs.test.mjs tests/catalog-short-copy.test.mjs tests/catalog-provider-evidence.test.mjs
      - run: node --import tsx --test tests/catalog-semantic-delta.test.mjs tests/catalog-photo-vector-reuse.test.mjs tests/catalog-publication-read-fetch.test.mjs
      - run: node --import tsx --test tests/catalog-clock.test.mjs tests/catalog-dispatch-workerd.test.mjs tests/catalog-runtime-native-history.test.mjs tests/catalog-vectorize-rest.test.mjs
      - run: node --import tsx --test --test-name-pattern="native batch|batch intent|eight-product|unchanged source|source counter" tests/catalog-approved-cohort.test.mjs tests/catalog-permanent-native-reader.test.mjs
      - run: node --import tsx --test tests/catalog-editorial-equivalence.test.mjs
      - run: node --import tsx --test --test-name-pattern="body-free published bulk seal" tests/catalog-permanent-freeze.test.mjs
      - run: node --import tsx --test --test-name-pattern="acknowledged indexing waits in the same driver|prepared freezing revision reuses|prepared config|config keeps its metadata bound|atomic multi-product receipt|Monday discovery publishes through a real permanent predecessor|automation driver resumes|exact staff admission shares|automation prepared before midnight" tests/catalog-cloudflare-weekly.test.mjs tests/catalog-approved-cohort.test.mjs
      - run: node --import tsx --test tests/catalog-d1-write-rest.test.mjs tests/catalog-maintenance-d1.test.mjs tests/catalog-daily-operator.test.mjs tests/catalog-publication-recovery-budget.test.mjs tests/catalog-telemetry-d1.test.mjs tests/catalog-exact-admission.test.mjs tests/catalog-workspace-successor.test.mjs
      - run: node --import tsx --test --test-name-pattern="run enumeration|killed process" tests/catalog-purge-workspaces.test.mjs tests/catalog-run-workspace.test.mjs
      - run: node --import tsx --test --test-name-pattern="routine activated permanent|routine metadata completion|routine permanent completion|routine completion finishes|routine completion retains|routine permanent successor|authentic permanent successor.*12 identities|saved admission recovery keeps|telemetry commit and idle|completed telemetry with drifted|permanent summary accepts" tests/catalog-run-workspace.test.mjs tests/catalog-permanent-freeze.test.mjs tests/catalog-activated-permanent-settlement.test.mjs
      - run: node --import tsx --test --test-name-pattern="routine background publication|background activation requires" tests/catalog-publish-release.test.mjs
      - run: npm run test:catalog-availability
      - run: npm run test:homepage
      - run: npm run test:search-demand
      - run: npx tsc -p scripts/staging/tsconfig.json && npx tsc -p workers/site/tsconfig.json
      - run: npm run lint
