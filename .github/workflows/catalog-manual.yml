name: Stupid Gifts — Catalog care
run-name: Stupid Gifts — ${{ inputs.mode || 'shadow' }} ${{ inputs.scheduled_at || '' }}

on:
  # The scoped Cloudflare clock dispatches this SAME serialized coordinator.
  # No GitHub cron: there must be one scheduling clock and one catalog writer.
  workflow_dispatch:
    inputs:
      mode:
        description: Code-only release, shadow, care/canary, editorial preview, or post-canary activation
        type: choice
        default: shadow
        options: [shadow, code, full, photos, canary, editorial, activate, admit, admin]
      canary_asin:
        description: Exact existing public ASIN; required for canary or explicit activation after its acceptance
        type: string
        default: ''
      admit_asins:
        description: Owner-picked comma-separated exact ASINs; admit mode only, no unrelated refresh or discovery
        type: string
        default: ''
      admit_saved_run:
        description: Optional accepted admission run key to reuse ORIGINAL saved observations; no supplier fetch
        type: string
        default: ''
      photo_asins:
        description: Optional exact existing ASINs for owner-requested photos mode; no copy or model generation
        type: string
        default: ''
      scheduled_at:
        description: Original Pacific due slot as UTC ISO timestamp; Cloudflare clock only
        type: string
        default: ''

permissions:
  contents: read

jobs:
  catalog:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: catalog-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.1'
      - name: Install the reviewed isolated uploader runtime
        # Runtime care publishes data, not Worker assets. Only explicit frozen
        # legacy code recovery needs this uploader sandbox.
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'code'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo apparmor_parser -r .github/catalog-bwrap.apparmor
      - name: Install coordinator dependencies without application credentials
        run: >-
          env -i HOME=/home/runner PATH="$PATH" CI=true
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Resume the original pending run or perform the explicitly chosen operation
        env:
          CATALOG_MODE: ${{ inputs.mode }}
          CATALOG_SCHEDULED_AT: ${{ inputs.scheduled_at || '' }}
          CATALOG_CANARY_ASIN: ${{ inputs.canary_asin }}
          CATALOG_ADMIT_ASINS: ${{ inputs.admit_asins }}
          CATALOG_ADMIT_SAVED_RUN: ${{ inputs.admit_saved_run }}
          CATALOG_PHOTO_ASINS: ${{ inputs.photo_asins }}
          STUPID_GIFTS_WEBSITE_CAMPAIGNS: ${{ secrets.STUPID_GIFTS_WEBSITE_CAMPAIGNS }}
          STUPID_GIFTS_OPERATOR_MODE: hosted
          STUPID_GIFTS_CLOUDFLARE_API_TOKEN: ${{ secrets.STUPID_GIFTS_CLOUDFLARE_API_TOKEN }}
          STUPID_GIFTS_AMAZON_CREDENTIAL_ID: ${{ secrets.STUPID_GIFTS_AMAZON_CREDENTIAL_ID }}
          STUPID_GIFTS_AMAZON_CREDENTIAL_SECRET: ${{ secrets.STUPID_GIFTS_AMAZON_CREDENTIAL_SECRET }}
          STUPID_GIFTS_OPENAI_API_KEY: ${{ secrets.STUPID_GIFTS_OPENAI_API_KEY }}
          STUPID_GIFTS_R2_ACCESS_KEY_ID: ${{ secrets.STUPID_GIFTS_R2_ACCESS_KEY_ID }}
          STUPID_GIFTS_R2_SECRET_ACCESS_KEY: ${{ secrets.STUPID_GIFTS_R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          node --import tsx scripts/catalog/hosted-coordinator.mjs "$CATALOG_MODE" "$CATALOG_CANARY_ASIN" "$CATALOG_ADMIT_ASINS" "$CATALOG_ADMIT_SAVED_RUN" "$CATALOG_PHOTO_ASINS"

  cleanup:
    name: Stupid Gifts — Expired cleanup
    needs: catalog
    if: >-
      github.ref == 'refs/heads/main' && needs.catalog.result == 'success' &&
      (inputs.mode == 'code' || inputs.mode == 'full' ||
       inputs.mode == 'photos' || inputs.mode == 'canary' || inputs.mode == 'admit' || inputs.mode == 'admin')
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 360
    concurrency:
      group: catalog-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.1'
      - name: Install cleanup dependencies without application credentials
        run: >-
          env -i HOME=/home/runner PATH="$PATH" CI=true
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Clean one due original workspace
        env:
          STUPID_GIFTS_OPERATOR_MODE: hosted
          STUPID_GIFTS_CLOUDFLARE_API_TOKEN: ${{ secrets.STUPID_GIFTS_CLOUDFLARE_API_TOKEN }}
          STUPID_GIFTS_R2_ACCESS_KEY_ID: ${{ secrets.STUPID_GIFTS_R2_ACCESS_KEY_ID }}
          STUPID_GIFTS_R2_SECRET_ACCESS_KEY: ${{ secrets.STUPID_GIFTS_R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          node --import tsx scripts/catalog/hosted-coordinator.mjs cleanup
