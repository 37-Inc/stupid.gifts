name: Catalog hosted isolation proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/catalog-hosted-proof.yml'
      - '.github/catalog-bwrap.apparmor'
      - 'scripts/catalog/publication-upload*'
      - 'tests/catalog-publication-upload*'

permissions:
  contents: read

concurrency:
  group: catalog-hosted-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.1'
      - name: Install isolated uploader runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo apparmor_parser -r .github/catalog-bwrap.apparmor
      - name: Install pinned uploader dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove Linux isolation without provider credentials
        env:
          CATALOG_LINUX_SANDBOX_TESTS: '1'
        run: >-
          node --experimental-transform-types --test
          tests/catalog-publication-upload-command.test.mjs
          tests/catalog-publication-upload-isolation.test.mjs
          tests/catalog-publication-upload-linux.test.mjs
